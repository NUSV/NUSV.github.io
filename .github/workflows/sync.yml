name: Sync project data

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [sync-projects]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate project pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/sync_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "NUSV Sync Bot"
          git config user.email "nusv-sync@users.noreply.github.com"
          git add projects tools
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: sync project pages from repositories"
            git push
          fi
